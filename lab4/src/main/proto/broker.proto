syntax = "proto3";
package broker;
option java_package = "prlabs.broker.proto";
option java_multiple_files = true;
import "google/protobuf/timestamp.proto";

service Broker {
  rpc Publish (PublishRequest) returns (PublishReply);
  rpc Subscribe (SubscribeRequest) returns (stream Message);
  rpc ListTopics (ListTopicsRequest) returns (ListTopicsReply);
}

message Message {
  int64 id = 1;
  string topic = 2;
  string sender = 3;
  string body = 4;
  google.protobuf.Timestamp time = 5;
}
message PublishRequest { string topic = 1; string sender = 2; string body = 3; }
message PublishReply { Message message = 1; }
message SubscribeRequest { string topic = 1; }
message ListTopicsRequest {}
message TopicInfo { string topic = 1; int64 size = 2; }
message ListTopicsReply { repeated TopicInfo topics = 1; }
